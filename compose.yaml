services:
  db:
    image: mysql:8.4
    container_name: ip26-pulse-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: itb_csv
      MYSQL_USER: itb
      MYSQL_PASSWORD: itbpassword
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data:
